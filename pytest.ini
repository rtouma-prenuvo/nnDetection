[pytest]
# Pytest configuration for nnDetection

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 6.0

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
    --color=yes

# Custom markers
markers =
    cuda: tests requiring CUDA
    extensions: tests requiring C++ CUDA extensions
    slow: slow running tests
    integration: integration tests requiring full setup

# Warnings
filterwarnings =
    ignore::FutureWarning:torch.cuda.amp
    ignore::UserWarning:torch.utils.cpp_extension
    ignore::DeprecationWarning

# Coverage (optional)
# Uncomment to enable coverage reporting
# addopts = --cov=nndet --cov-report=html --cov-report=term

